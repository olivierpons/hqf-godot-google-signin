[package]
name = "hqf-godot-google-signin"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Olivier Pons / HQF Development"]
description = "Google Sign-In for Godot 4.7+ Android games, through the Credential Manager API"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
godot = { version = "0.5.5", features = ["api-4-7"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_must_use = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
